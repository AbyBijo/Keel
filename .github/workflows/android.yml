# Keel (native) — CI
# - Unit tests + debug APK on every push / PR to main.
# - The debug APK is uploaded as artifact `keel-debug-apk`.
# - Release steps run ONLY when the 4 release secrets exist. Secrets are
#   read once at job level into env vars (never secrets.* in a step if:).
# - NO GitHub Release is ever created.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Release secrets, read once at job level.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform + build-tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify debug APK signature (v2 + v3)
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          apksigner verify --verbose --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # -- Release (only when the secrets exist) ---------------------------
      - name: Check release secrets
        id: release-check
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_release_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Release secrets not set — skipping release build."
          fi

      - name: Write release keystore
        if: steps.release-check.outputs.has_release_secrets == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keel-release.keystore
          {
            echo "storeFile=/tmp/keel-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build release APK
        if: steps.release-check.outputs.has_release_secrets == 'true'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify release APK signature (v2 + v3)
        if: steps.release-check.outputs.has_release_secrets == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          apksigner verify --verbose --print-certs "$APK"

      - name: Upload release APK
        if: steps.release-check.outputs.has_release_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keel-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
